name: Validate Install Scripts

on:
  push:
    paths:
      - 'install/**'
      - '.github/workflows/install-scripts.yml'
  pull_request:
    paths:
      - 'install/**'
      - '.github/workflows/install-scripts.yml'

concurrency:
  group: install-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (baseline, fail on new findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Syntax-check every install script (bash -n)
        run: |
          shopt -s nullglob
          files=(install/*.sh install/*/*.sh)
          echo "Checking ${#files[@]} shell scripts"
          rc=0
          for f in "${files[@]}"; do
            if bash -n "$f"; then
              echo "  OK   $f"
            else
              echo "  FAIL $f"
              rc=1
            fi
          done
          exit "$rc"

      - name: Run ShellCheck and diff against baseline
        run: |
          set +e
          shellcheck -f json install/*.sh install/*/*.sh > /tmp/sc.json 2>/dev/null
          set -e
          if [ ! -s /tmp/sc.json ]; then
            echo "shellcheck produced no JSON output — treating as no findings"
            echo '[]' > /tmp/sc.json
          fi
          python3 - <<'PY'
          import json, sys
          with open('/tmp/sc.json') as f:
              data = json.load(f)
          pairs = sorted({f"{d['file']}|SC{d['code']}" for d in data})
          baseline = set()
          with open('install/shellcheck-baseline.txt') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  baseline.add(line)
          new = [p for p in pairs if p not in baseline]
          print("total unique findings: %d" % len(pairs))
          print("baseline tolerated:    %d" % len(baseline))
          for p in pairs:
              print("  [%s] %s" % ("tolerated" if p in baseline else "NEW", p))
          if new:
              print("\nFAIL: %d NEW finding(s) not in baseline:" % len(new))
              for p in new:
                  print("  " + p)
              print("\nTo tolerate a finding deliberately, add its 'path|SCxxxx' line to install/shellcheck-baseline.txt and commit.")
              sys.exit(1)
          print("\nOK: 0 new ShellCheck findings")
          PY

  matrix:
    name: "Matrix: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:13
          - ubuntu:26.04
          - fedora:latest
          - rockylinux:9
          - almalinux:9
          - archlinux:latest
    steps:
      - uses: actions/checkout@v6

      - name: Pull image
        run: docker pull "${{ matrix.image }}"

      # AC1b: run the real install -> update -> uninstall lifecycle INSIDE the
      # distro container (not on the host). NOMAD_CI_MODE=1 skips daemon/GPU
      # operations that a non-privileged CI container cannot perform;
      # NOMAD_ASSUME_YES=1 suppresses the interactive confirmations. The sudo
      # shim covers the 5/6 base images that ship no sudo (and where `sudo -n
      # true` fails even as root) — when uid 0, sudo is a passthrough no-op.
      #
      # The lifecycle script is written to a host file and bind-mounted into
      # the container (read-write so the shim install can succeed), instead of
      # being inlined inside `bash -c '...'`. Inlining a quoted heredoc inside a
      # single-quoted -c string trips shellcheck SC2026; a standalone script
      # file keeps the shim heredoc unambiguous and shellcheck-clean.
      - name: Run install -> update -> uninstall in the container
        run: |
          set -eu
          cat > "$RUNNER_TEMP/lifecycle.sh" <<'LIFE'
          #!/bin/sh
          set -eu

          # 0. sudo shim: minimal base images ship no sudo, and `sudo -n true`
          #    fails even as root on the debian/ubuntu minimal images. When
          #    uid 0, sudo is a passthrough no-op wrapper, so a small shim that
          #    drops no-op flags (-n/-S/-H/-u/-g) and execs the command that
          #    remains satisfies check_has_sudo and every `sudo <pkg-mgr>` call.
          if ! command -v sudo >/dev/null 2>&1; then
            cat > /usr/local/bin/sudo <<'SHIM'
          #!/bin/sh
          # passthrough sudo shim (CI only): we are root, so sudo is a no-op.
          # Strip no-op sudo flags (-n, -S, -H, -u, -g) and exec the rest.
          for a in "$@"; do
            case "$a" in
              -n|-S|-H) ;;
              -u|-g)
                shift
                shift ;;
              *)
                break ;;
            esac
            shift
          done
          if [ -n "$1" ]; then
            exec "$@"
          fi
          SHIM
            chmod +x /usr/local/bin/sudo
          fi
          command -v sudo >/dev/null 2>&1 || { echo "sudo missing after shim"; exit 1; }
          sudo -n true || { echo "sudo -n true failed after shim"; exit 1; }
          echo "PASS sudo at $(command -v sudo)"

          # 1. INSTALL (exercises: package family detection, pkg_install,
          #    pkg_install_docker, resolve_local_ip, dir creation, and the
          #    compose-file download from the upstream collection URL).
          echo "===== STEP 1/3: install ====="
          bash /work/install_nomad.sh
          test -f /opt/project-nomad/compose.yml || { echo "install did not produce /opt/project-nomad/compose.yml"; exit 1; }
          echo "PASS /opt/project-nomad/compose.yml present"

          # 2. UPDATE (exercises: docker-present gate, compose-file gate,
          #    force_recreate — all hatched or satisfied by the install step).
          echo "===== STEP 2/3: update ====="
          bash /work/update_nomad.sh
          echo "PASS update exited 0"

          # 3. UNINSTALL (exercises: compose-file gate, storage_cleanup, and
          #    daemon-dependent cleanup — all hatched or assume-yes).
          echo "===== STEP 3/3: uninstall ====="
          bash /work/uninstall_nomad.sh
          test ! -d /opt/project-nomad || { echo "uninstall did not remove /opt/project-nomad"; exit 1; }
          echo "PASS /opt/project-nomad removed"

          echo "### LIFECYCLE_OK"
          LIFE
          chmod +x "$RUNNER_TEMP/lifecycle.sh"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/install:/work:ro" \
            -v "${RUNNER_TEMP}/lifecycle.sh:/lifecycle.sh" \
            -e NOMAD_CI_MODE=1 \
            -e NOMAD_ASSUME_YES=1 \
            -e TERM=dumb \
            -w /work \
            --user 0:0 \
            "${{ matrix.image }}" \
            sh -c 'exec bash /lifecycle.sh'
